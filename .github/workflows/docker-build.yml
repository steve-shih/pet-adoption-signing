# ==========================================
# 📂 存放路徑：pet-adoption-signing/.github/workflows/docker-build.yml
# 📖 檔案解說：這是一個 GitHub Actions 自動化腳本，專門用來將 寵物認養專案 打包成 Docker Image 並推送到雲端倉庫 (GHCR)。
# 🚀 觸發條件：當有人把程式碼推送到 main 分支時就會自動執行。
# ==========================================

name: Build and Push Docker Image

on:
  push:
    branches:
      - main # 只有推送到 main 分支時才會觸發

env:
  REGISTRY: ghcr.io # 指定推送到 GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }}-pet-adoption # 設定打包出來的映像檔名稱，例如 steve-shih/pet-adoption-signing-pet-adoption

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # [步驟 1] 下載程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # [步驟 2] 登入 GitHub 雲端倉庫
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # [步驟 3] 萃取標籤與中介資料
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # [步驟 4] 執行 Docker 打包並推送到雲端
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # 根目錄尋找 Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
