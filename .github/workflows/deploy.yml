# ==========================================
# 📂 存放路徑：pet-adoption-signing/.github/workflows/deploy.yml
# 📖 檔案解說：這是一個舊版或特定用途的 GitHub Actions 腳本，專門用來把專案打包並推送到 Google Cloud Run (GCP)。這跟我們目前使用的 K8s 架構不同。
# 🚀 觸發條件：當有人把程式碼推送到 main 分支時，就會自動執行。
# ==========================================

name: Deploy to GCP Cloud Run # 這個腳本的名稱

on:
  push:
    branches:
      - main # 只有推送到 main 分支時才會觸發

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 在最新的 Ubuntu 虛擬機上跑
    steps:
      # [步驟 1] 下載程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # [步驟 2] 設定 Node.js 環境 (為了解析 npm)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # [步驟 3] 安裝相依套件 (可選，如果您想在打包前跑測試)
      - name: Install dependencies
        run: npm ci --only=production

      # [步驟 4] 登入 Google Cloud (使用存放在 GitHub Secrets 的 GCP_SA_KEY)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # [步驟 5] 設定 Google Cloud SDK (gcloud 指令)
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: 'beta'

      # [步驟 6] 設定 Docker 認證，讓它可以推送到 GCP 的倉庫 (Artifact Registry)
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      # [步驟 7] 開始打包 Docker Image 並上傳到 GCP 倉庫
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pet-signing-repo/pet-signing:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      # [步驟 8] 命令 GCP Cloud Run 重新部署最新版的 Docker Image
      - name: Deploy to Cloud Run
        run: |
          IMAGE_TAG=asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pet-signing-repo/pet-signing:${{ github.sha }}
          gcloud run deploy pet-signing \
            --image $IMAGE_TAG \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated \
            --port 5000 \
            --quiet
